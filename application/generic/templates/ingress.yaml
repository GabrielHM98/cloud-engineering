{{- if eq .Values.exposure.type "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
  {{- with .Values.exposure.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.exposure.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.exposure.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.exposure.host | quote }}
      http:
        paths:
          - path: {{ .Values.exposure.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "web-service.fullname" . }}
                port:
                  name: http
{{- end }}
