{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-service.fullname" . }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  {{- if .Values.networkPolicy.ingressPeers }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
