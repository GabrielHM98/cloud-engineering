    helm.sh/chart: "web-service-0.1.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false
---
# Source: web-service/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api
  labels:
    app.kubernetes.io/name: web-service
    app.kubernetes.io/instance: demo
    helm.sh/chart: "web-service-0.1.0"
    app.kubernetes.io/managed-by: Helm
data: {"APP_ENV":"development","LOG_LEVEL":"info"}
---
